name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build -x test
      - name: Publish jar as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$JAR" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Automatic build of main ($GITHUB_SHA)."
