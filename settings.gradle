pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Enables Gradle toolchain auto-provisioning (used to run Minecraft on Java 21).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
