# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Let Gradle toolchains fetch a Java 25 runtime for `runClient` even if Gradle itself runs on another Java.
org.gradle.java.installations.auto-download=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.20

# Mod Properties
mod_version=1.5.5
maven_group=kraftattacke.bully.net
archives_base_name=bully

# Dependencies
fabric_api_version=0.160.7+26.3